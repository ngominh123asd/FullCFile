# FileForge - Docker Compose Configuration
# Full stack: Frontend, Backend, PostgreSQL, Redis, MinIO

services:
  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - fileforge-network

  # ==================== BACKEND API ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${OCR_BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fileforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - OCR_MODEL_DIR=/app/models
      - OCR_SCAN_DEVICE=${OCR_SCAN_DEVICE:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backend/fonts:/usr/share/fonts/truetype/windows
      - ocr-models:/app/models
      - file-uploads:/tmp/fileforge_uploads
      - file-outputs:/tmp/fileforge_outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - fileforge-network

  # ==================== CELERY WORKER ====================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fileforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - OCR_MODEL_DIR=/app/models
      - OCR_SCAN_DEVICE=${OCR_SCAN_DEVICE:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backend/fonts:/usr/share/fonts/truetype/windows
      - ocr-models:/app/models
      - file-uploads:/tmp/fileforge_uploads
      - file-outputs:/tmp/fileforge_outputs
      - celery-data:/tmp/celery
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - fileforge-network

  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fileforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fileforge"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fileforge-network

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - fileforge-network

  # ==================== MINIO (S3 Storage) ====================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - fileforge-network

  # ==================== MINIO INITIALIZER ====================
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/fileforge --ignore-existing;
      mc anonymous set download myminio/fileforge;
      exit 0;
      "
    networks:
      - fileforge-network

# ==================== NETWORKS ====================
networks:
  fileforge-network:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  postgres-data:
  redis-data:
  minio-data:
  ocr-models:
  file-uploads:
  file-outputs:
  celery-data:
