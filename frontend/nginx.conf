server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Docker can assign a new address when the backend container is recreated.
    # Resolve the service name at request time instead of caching its startup IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $backend_upstream http://backend:8000;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy with real-time Server-Sent Events (SSE) streaming support
    location = /health {
        proxy_pass $backend_upstream;
    }
    location = /docs {
        proxy_pass $backend_upstream;
    }
    location = /openapi.json {
        proxy_pass $backend_upstream;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Streaming Settings (Crucial for live real-time progress)
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
